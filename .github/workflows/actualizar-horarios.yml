# Robot que mantiene al día los horarios y los DESVÍOS de Vitrasa para la app Paradiña.
#
# Cada 3 horas:
#  1. descarga el GTFS oficial del Concello de Vigo y lo compila (horarios + trazados);
#  2. lee los avisos de transporte del Concello y sus PDF de Vitrasa; los nuevos o cambiados los
#     lee una IA (Claude; secreto ANTHROPIC_API_KEY) y se guardan en datos/desvios/extracciones.json;
#  3. aplica los desvíos a los horarios y trazados (calles reales de OpenStreetMap, rutas de bus,
#     comprobación con el tiempo real) — ver scripts/desvios/;
#  4. si el resultado ha cambiado, lo publica en GitHub Pages, de donde lo descarga la app.
# Si algo falla, no publica nada (o publica los horarios sin desvíos) y la app sigue funcionando.

name: Actualizar horarios

on:
  schedule:
    # Cada 3 horas (el Concello publica el GTFS y los avisos a horas variables).
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizar-horarios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Renovar calles de OpenStreetMap (una vez por semana)
        continue-on-error: true
        run: |
          EDAD=$(( ( $(date +%s) - $(date -d "$(jq -r '.generado' datos/osm/calles.json)" +%s) ) / 86400 ))
          echo "calles.json tiene $EDAD días"
          if [ "$EDAD" -ge 7 ]; then node scripts/desvios/descargar-calles.mjs; fi

      - name: Descargar GTFS de Vitrasa
        run: |
          curl -fsSL --retry 4 --retry-delay 20 -A "Paradina-datos/1.0" \
            -o gtfs.zip "https://datos.vigo.org/data/transporte/gtfs_vigo.zip"
          ls -l gtfs.zip
          echo "HASH=$(sha256sum gtfs.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Compilar horarios y trazados
        run: |
          unzip -o -q gtfs.zip -d gtfs
          mkdir -p compilado
          node scripts/compilar-gtfs.mjs gtfs compilado/horarios.json

      - name: Leer avisos y aplicar desvíos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/desvios/ejecutar.mjs compilado "$HASH"

      - name: Publicar
        run: |
          git config user.name "bus-galicia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Horarios $(jq -r '.desde + " → " + .hasta' datos/version.json) · desvíos $(jq -r '.desvios' datos/version.json)"
            git push
          fi

      # Si hay avisos sin leer, una incidencia abierta (GitHub manda un correo al abrirla); se cierra
      # sola cuando ya están todos leídos (por la IA con la clave, o por la tarea local).
      - name: Avisar de avisos sin leer
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="Avisos de Vitrasa sin leer"
          ABIERTA=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number --jq '.[0].number // empty')
          if [ -s compilado/sin-leer.txt ]; then
            CUERPO=$(printf 'Hay avisos activos que todavía no se han leído, así que la app solo marca sus líneas como «desvío sin dibujar»:\n\n%s\n\nPara leerlos: abre Claude Code en la carpeta bus-galicia-datos y dile «lee los avisos pendientes», o espera a la tarea programada.' "$(cat compilado/sin-leer.txt)")
            if [ -z "$ABIERTA" ]; then
              gh issue create --title "$TITULO" --body "$CUERPO"
            elif [ "$(gh issue view "$ABIERTA" --json body --jq .body)" != "$CUERPO" ]; then
              gh issue edit "$ABIERTA" --body "$CUERPO"
              gh issue comment "$ABIERTA" --body "Ha cambiado la lista de avisos sin leer."
            fi
          elif [ -n "$ABIERTA" ]; then
            gh issue close "$ABIERTA" --comment "Ya están todos leídos."
          fi
